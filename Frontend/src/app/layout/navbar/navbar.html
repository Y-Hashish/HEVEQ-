<nav class="navbar">
    <div class="container">
        <a routerLink="/" class="nav-brand">
            <span>هيڤ</span>يك
        </a>

        <form class="navbar-ai-search" *ngIf="showAiSearch" (submit)="$event.preventDefault(); submitAiSearch()">
            <input
                type="search"
                name="aiQuery"
                [(ngModel)]="aiQuery"
                [disabled]="aiLoading"
                placeholder="اسأل الذكاء الاصطناعي عن خدمة أو معدة أو قطعة..."
            >
            <button type="submit" [disabled]="aiLoading || !aiQuery.trim()" title="بحث ذكي">
                <i class="fa-solid fa-spinner fa-spin" *ngIf="aiLoading"></i>
                <i class="fa-solid fa-magnifying-glass" *ngIf="!aiLoading"></i>
            </button>
        </form>

        <div class="navbar-links" *ngIf="showNavLinks">
            <a routerLink="/marketplace" class="navbar-link" [class.active]="isMarketplaceActive">
                السوق
            </a>

            <a routerLink="/services" class="navbar-link" [class.active]="isServicesActive">
                المتجر
            </a>
        </div>

        <div class="nav-actions">
            <button type="button" class="action-btn" title="تغيير المظهر" (click)="toggleTheme()">
                <i [class]="themeIcon"></i>
            </button>


            <ng-container *ngIf="isAuth; else guestActions">
                <button type="button" class="action-btn notification-action" title="الإشعارات" routerLink="/notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-badge" *ngIf="unreadNotifications > 0">{{ unreadNotifications > 99 ? '99+' : unreadNotifications }}</span>
                </button>

                <div class="user-profile-dropdown-wrapper">
                    <button type="button" class="user-profile" aria-haspopup="true"
                        [attr.aria-expanded]="isDropdownOpen" (click)="toggleDropdown($event)">
                        <div class="avatar">
                            {{ userInitials }}
                        </div>

                        <span class="user-name">
                            {{ userName }}
                        </span>

                        <span class="dropdown-caret">
                            ▼
                        </span>
                    </button>

                    <div class="dropdown-menu" [class.show]="isDropdownOpen" (click)="$event.stopPropagation()">
                        <a [routerLink]="dashboardLink" class="dropdown-item" (click)="isDropdownOpen = false">
                            {{ dashboardLabel }}
                        </a>

                        <a *ngIf="showAccountVerificationLink" routerLink="/account-verification" class="dropdown-item" (click)="isDropdownOpen = false">
                            توثيق الحساب
                        </a>

                        <button type="button" class="dropdown-item logout-btn-item" (click)="logout()">
                            تسجيل الخروج
                        </button>
                    </div>
                </div>

                <button *ngIf="showMobileButton" type="button" class="btn btn-primary btn-icon mobile-menu-btn"
                    (click)="toggleMobileMenu()">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </ng-container>

            <ng-template #guestActions>
                <a routerLink="/register" class="btn btn-outline btn-sm guest-register-link">
                    إنشاء حساب جديد
                </a>
                <a routerLink="/login" class="btn btn-primary btn-sm">
                    تسجيل الدخول
                </a>
            </ng-template>
        </div>
    </div>
</nav>

<div class="ai-chat-backdrop" *ngIf="aiChatOpen" (click)="closeAiChat()"></div>
<div class="ai-chat-modal" *ngIf="aiChatOpen" (click)="$event.stopPropagation()" dir="rtl">
    <div class="ai-chat-header">
        <div>
            <h3>مساعد البحث الذكي</h3>
            <p>جاوب على السؤال عشان نرشح لك النتائج المناسبة.</p>
        </div>
        <button type="button" class="ai-chat-close" (click)="closeAiChat()">×</button>
    </div>

    <div class="ai-chat-body">
        <div class="ai-chat-message" *ngFor="let turn of aiConversation" [class.user]="turn.role === 'user'" [class.assistant]="turn.role === 'assistant'">
            <span class="ai-chat-role">{{ turn.role === 'user' ? 'أنت' : 'هيڤيك AI' }}</span>
            <p>{{ turn.content }}</p>
        </div>

        <div class="ai-chat-message assistant" *ngIf="aiLoading">
            <span class="ai-chat-role">هيڤيك AI</span>
            <p>جاري التفكير في أفضل ترشيحات...</p>
        </div>
    </div>

    <div class="alert error" *ngIf="aiError">{{ aiError }}</div>

    <form class="ai-chat-form" (submit)="$event.preventDefault(); sendAiChatMessage()">
        <input
            type="text"
            name="aiChatInput"
            [(ngModel)]="aiChatInput"
            [disabled]="aiLoading"
            placeholder="اكتب ردك هنا..."
        >
        <button type="submit" class="btn btn-primary" [disabled]="aiLoading || !aiChatInput.trim()">
            إرسال
        </button>
    </form>
</div>
