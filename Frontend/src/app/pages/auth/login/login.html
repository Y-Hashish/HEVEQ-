<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-logo">
                <span>هيڤ</span>يك
            </div>

            <h1>تسجيل الدخول</h1>
            <p>ادخل بياناتك للوصول إلى حسابك</p>
        </div>

        <form (ngSubmit)="submit()">
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input class="form-input" type="email" name="email" [(ngModel)]="email" placeholder="example@email.com"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <div class="password-field">
                    <input class="form-input" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
                        {{ showPassword ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <p class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </p>

            <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading">
                {{ isLoading ? 'جاري تسجيل الدخول...' : 'تسجيل الدخول' }}
            </button>
        </form>

        <div class="auth-footer">
            ليس لديك حساب؟
            <a routerLink="/register">إنشاء حساب جديد</a>
        </div>
    </div>
</div>
