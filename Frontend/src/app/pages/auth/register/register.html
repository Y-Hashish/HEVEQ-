<div class="auth-wrapper">
    <div class="card auth-card animate-on-scroll">
        <div class="auth-header">
            <div class="auth-logo">
                <span>هيڤ</span>يك
            </div>

            <h2>انضم إلينا اليوم</h2>
            <p>اختر نوع الحساب وابدأ رحلتك</p>
        </div>

        <div class="role-selector">
            <button type="button" class="role-option" [class.active]="selectedRole === 'Customer'"
                (click)="selectRole('Customer')">
                <span class="role-icon">👤</span>
                <strong>عميل</strong>
            </button>

            <button type="button" class="role-option" [class.active]="selectedRole === 'Provider'"
                (click)="selectRole('Provider')">
                <span class="role-icon">🏗️</span>
                <strong>مزود خدمة</strong>
            </button>
        </div>

        <form (ngSubmit)="submit()">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">الاسم الأول</label>
                    <input type="text" class="form-input" name="firstName" [(ngModel)]="firstName" placeholder="أحمد"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">اسم العائلة</label>
                    <input type="text" class="form-input" name="lastName" [(ngModel)]="lastName" placeholder="حسن"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" class="form-input" name="userName" [(ngModel)]="userName" placeholder="ahmed_hassan"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-input" name="email" [(ngModel)]="email" placeholder="example@mail.com"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label">رقم التليفون</label>
                <input type="tel" class="form-input" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="01012345678"
                    required maxlength="11">
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-input" name="password" [(ngModel)]="password" placeholder="••••••••"
                    required>
            </div>

            <p class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </p>

            <p class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </p>

            <button type="submit" class="btn btn-primary submit-btn" [disabled]="isLoading">
                {{ isLoading ? 'جاري إنشاء الحساب...' : 'إنشاء الحساب' }}
            </button>
        </form>

        <div class="auth-footer">
            لديك حساب بالفعل؟
            <a routerLink="/login">تسجيل الدخول</a>
        </div>
    </div>
</div>
