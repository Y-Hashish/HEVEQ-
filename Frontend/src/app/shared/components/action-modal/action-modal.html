<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ title }}</h3>
      <button class="close-btn" (click)="onClose()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="modal-body">
      <p class="modal-desc" *ngIf="description">{{ description }}</p>
      
      <div class="form-group" *ngIf="requireNote">
        <label class="form-label" [class.required]="requireNote">{{ noteLabel }}</label>
        <textarea 
          class="form-control" 
          [(ngModel)]="noteText" 
          rows="3" 
          [placeholder]="'أدخل ' + noteLabel"
          [class.is-invalid]="isSubmitted && requireNote && !noteText.trim()">
        </textarea>
        <div class="invalid-feedback" *ngIf="isSubmitted && requireNote && !noteText.trim()">
          هذا الحقل مطلوب لإتمام الإجراء.
        </div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onClose()">{{ cancelText }}</button>
      <button class="btn" [ngClass]="'btn-' + confirmColor" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
